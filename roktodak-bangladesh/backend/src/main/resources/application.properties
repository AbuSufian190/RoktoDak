spring.application.name=roktodak
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/roktodak?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
# No default secret on purpose: set JWT_SECRET (32+ chars) or the app refuses to start.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry-minutes=120
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
